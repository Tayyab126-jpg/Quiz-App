<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <base href="https://quiz-app-git-main-tab-bi.vercel.app/">
  <meta name="theme-color" content="#020617">
  <link rel="manifest" href="manifest.json">
  <title>Quiz Engine - Game Buddy</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="theme-dark-emerald" style="height: 100dvh; justify-content: center; align-items: center; padding: 20px;">
  <section class="unity-panel" style="width: 100%; max-width: 380px; padding: 26px; text-align: center;">
    <div style="width: 54px; height: 54px; display: grid; place-items: center; margin: 0 auto 14px; border-radius: 16px; background: var(--accent-gradient); color: white; font-size: 21px;">
      <i class="fa-solid fa-wand-magic-sparkles"></i>
    </div>
    <h1 style="font-size: 18px; margin-bottom: 8px;">Your Game Chat</h1>
    <p style="font-size: 12px; color: var(--text-muted); line-height: 1.6; margin-bottom: 18px;">Player-to-player messages are off in local-only mode. Chat with Arena Buddy online, or keep playing offline games.</p>
    <a href="ai.html" class="unity-btn" style="display: block; padding: 12px; text-decoration: none; margin-bottom: 10px;">Ask Arena Buddy</a>
    <a href="mini-game.html" class="unity-btn" style="display: block; padding: 12px; text-decoration: none; background: rgba(255,255,255,0.08); border: 1px solid var(--border-color);">Play Memory Match</a>
    <a href="home.html" style="display: inline-block; margin-top: 18px; color: var(--text-muted); font-size: 11px;">Back to home</a>
  </section>
  <script src="local-profile.js"></script>
  <script src="offline.js"></script>
  <script>
    if (!localStorage.getItem("authToken")) window.location.href = "login.html";
    else document.body.className = localStorage.getItem("appTheme") || "theme-dark-emerald";
  </script>
</body>
</html>
