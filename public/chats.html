<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <base href="https://quiz-app-git-main-tab-bi.vercel.app/">
  <meta name="theme-color" content="#020617">
  <link rel="manifest" href="manifest.json">
  <title>Quiz Engine - Messages Inbox</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body id="appBody" class="theme-dark-emerald" style="display: flex; flex-direction: column; justify-content: space-between; height: 100vh; overflow: hidden;">

  <header style="padding: 15px 24px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border-color);">
    <div style="display: flex; align-items: center; gap: 10px;">
      <div style="width: 36px; height: 36px; background: rgba(16,185,129,0.1); border: 1px solid var(--accent-color); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: var(--accent-color);">
        <i class="fa-solid fa-comments"></i>
      </div>
      <div>
        <h1 style="font-size: 13px; font-weight: 800;">Messages Inbox</h1>
        <p style="font-size: 10px; color: var(--text-muted);">Your game buddy is ready to help</p>
      </div>
    </div>
    <div style="display: flex; gap: 8px;">
      <a href="ai.html" aria-label="Ask Arena Buddy" title="Ask Arena Buddy" class="unity-btn" style="width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; color: var(--text-main); text-decoration: none;"><i class="fa-solid fa-wand-magic-sparkles"></i></a>
      <a href="home.html" aria-label="Home" class="unity-btn" style="width: 36px; height: 36px; border-radius: 10px; background: rgba(255,255,255,0.06); color: var(--text-main); border: 1px solid var(--border-color); display: flex; align-items: center; justify-content: center; text-decoration: none;">
        <i class="fa-solid fa-house"></i>
      </a>
    </div>
  </header>

  <main style="flex: 1; padding: 20px; overflow-y: auto;" class="no-scrollbar">
    <div style="width: 100%; max-width: 420px; margin: 0 auto; display: grid; gap: 12px;">
      <a href="ai.html" class="unity-panel" style="color: var(--text-main); text-decoration: none; padding: 18px; display: flex; align-items: center; gap: 14px;">
        <span style="width: 46px; height: 46px; display: grid; place-items: center; border-radius: 14px; background: var(--accent-gradient); color: white;"><i class="fa-solid fa-wand-magic-sparkles"></i></span>
        <span><strong style="display: block; font-size: 14px;">Ask Arena Buddy</strong><small style="color: var(--text-muted);">Your game AI knows your name and level</small></span>
        <i class="fa-solid fa-chevron-right" style="margin-left: auto; color: var(--accent-color);"></i>
      </a>
      <a href="mini-game.html" class="unity-panel" style="color: var(--text-main); text-decoration: none; padding: 18px; display: flex; align-items: center; gap: 14px;">
        <span style="width: 46px; height: 46px; display: grid; place-items: center; border-radius: 14px; background: rgba(255,255,255,0.08); color: var(--accent-color);"><i class="fa-solid fa-shapes"></i></span>
        <span><strong style="display: block; font-size: 14px;">Play Memory Match</strong><small style="color: var(--text-muted);">A no-reading animal-pair game</small></span>
        <i class="fa-solid fa-chevron-right" style="margin-left: auto; color: var(--accent-color);"></i>
      </a>
      <p style="text-align: center; padding: 12px; color: var(--text-muted); font-size: 11px;">Player-to-player chat and the online leaderboard are turned off in local-only mode. Your game progress stays on this device.</p>
    </div>
  </main>

  <footer style="padding: 12px 24px; display: flex; align-items: center; justify-content: space-around; border-top: 1px solid var(--border-color);">
    <a href="home.html" style="color: var(--text-muted); text-decoration: none; display: flex; flex-direction: column; align-items: center; font-size: 10px;">
      <i class="fa-solid fa-house" style="font-size: 14px; margin-bottom: 2px;"></i> Home
    </a>
    <a href="chats.html" style="color: var(--accent-color); text-decoration: none; display: flex; flex-direction: column; align-items: center; font-size: 10px; font-weight: 700;">
      <i class="fa-solid fa-comments" style="font-size: 14px; margin-bottom: 2px;"></i> Chat
    </a>
    <a href="mini-game.html" style="color: var(--text-muted); text-decoration: none; display: flex; flex-direction: column; align-items: center; font-size: 10px;">
      <i class="fa-solid fa-shapes" style="font-size: 14px; margin-bottom: 2px;"></i> Games
    </a>
  </footer>

  <script src="local-profile.js"></script>
  <script src="offline.js"></script>
  <script>
    window.onload = async function() {
      const savedTheme = localStorage.getItem("appTheme") || "theme-dark-emerald";
      document.body.className = savedTheme;
      if (!localStorage.getItem("authToken")) window.location.href = "login.html";
    };
  </script>
</body>
</html>
