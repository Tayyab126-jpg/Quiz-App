<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <base href="https://quiz-app-git-main-tab-bi.vercel.app/">
  <meta name="theme-color" content="#020617">
  <link rel="manifest" href="manifest.json">
  <title>Quiz Engine - Login</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="theme-slate-light" style="align-items: center; justify-content: center;">

  <div class="unity-panel" style="width: 100%; max-width: 360px; padding: 30px; text-align: center;">
    <div style="width: 50px; height: 50px; background: var(--accent-gradient); border-radius: 14px; margin: 0 auto 15px auto; display: flex; align-items: center; justify-content: center; font-size: 20px; color: #fff;">
      <i class="fa-solid fa-gamepad"></i>
    </div>
    <h2 style="font-size: 18px; font-weight: 800; margin-bottom: 5px;">Player Authentication</h2>
    <p style="font-size: 11px; color: var(--text-muted); margin-bottom: 25px;">Sign in to your Quiz Game account</p>

    <form onsubmit="handleLogin(event)" style="display: flex; flex-direction: column; gap: 14px; text-align: left;">
      <div>
        <label style="font-size: 10px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 4px; display: block;">Email</label>
        <input type="email" id="email" required placeholder="player@domain.com">
      </div>
      <div>
        <label style="font-size: 10px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 4px; display: block;">Password</label>
        <input type="password" id="password" required placeholder="••••••••">
      </div>
      <button type="submit" id="submitBtn" class="unity-btn" style="padding: 12px; font-size: 12px; margin-top: 10px;">Login to Arena</button>
    </form>
    <p style="font-size: 11px; color: var(--text-muted); margin: 16px 0 0;"><a href="reset-password.html" style="color: var(--accent-color); font-weight: 700; text-decoration: none;">Forgot Password?</a></p>
    <p style="font-size: 11px; color: var(--text-muted); margin-top: 12px;">New player? <a href="signup.html" style="color: var(--accent-color); font-weight: 700; text-decoration: none;">Create Account</a></p>
  </div>

  <script src="api-client.js"></script>
  <script src="offline.js"></script>
  <script src="auth-ui.js"></script>
  <script>
    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById("email").value.trim().toLowerCase();
      const password = document.getElementById("password").value;
      const btn = document.getElementById("submitBtn");
      localStorage.removeItem("authToken");
      localStorage.removeItem("userEmail");
      btn.innerText = "Connecting to Server...";
      btn.disabled = true;

      try {
        if (!navigator.onLine) {
          await showAuthAlert("You are offline. Connect to the internet and try logging in again.", "offline");
          return;
        }
        const response = await fetch("/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password })
        });
        const data = await response.json();
        if (!response.ok || !data.success || !data.token || !data.user || !data.user.email) {
          await showAuthAlert(data.message || "Invalid login credentials.");
          return;
        }
        localStorage.setItem("authToken", data.token);
        localStorage.setItem("userEmail", data.user.email);
        window.location.href = "home.html";
      } catch (err) {
        await showAuthAlert(navigator.onLine ? "Could not connect to the server. Please try again." : "You are offline. Connect to the internet and try logging in again.", navigator.onLine ? "error" : "offline");
      } finally {
        btn.innerText = "Login to Arena";
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
