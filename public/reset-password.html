<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#020617">
  <link rel="manifest" href="manifest.json">
  <title>Quiz Engine - Reset Device Profile</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="theme-slate-light" style="align-items: center; justify-content: center;">
  <div class="unity-panel" style="position: relative; width: 100%; max-width: 360px; padding: 30px; text-align: center;">
    <a href="login.html" aria-label="Back to login" title="Back to login" style="position: absolute; top: 14px; left: 14px; color: var(--text-muted); font-size: 16px; text-decoration: none;">
      <i class="fa-solid fa-arrow-left"></i>
    </a>
    <div style="width: 50px; height: 50px; background: var(--accent-gradient); border-radius: 14px; margin: 0 auto 15px auto; display: flex; align-items: center; justify-content: center; font-size: 20px; color: #fff;">
      <i class="fa-solid fa-key"></i>
    </div>
    <h2 style="font-size: 18px; font-weight: 800; margin-bottom: 8px;">Reset This Device Profile</h2>
    <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 20px; line-height: 1.5;">Profiles are stored only on this device, so there is no email reset. Removing a profile also deletes its saved levels and scores. You can then create a new profile.</p>
    <form onsubmit="resetLocalProfile(event)" style="display: flex; flex-direction: column; gap: 14px; text-align: left;">
      <div>
        <label for="email" style="font-size: 10px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 4px; display: block;">Profile Email</label>
        <input type="email" id="email" required maxlength="254" placeholder="player@domain.com">
      </div>
      <button type="submit" class="unity-btn" style="padding: 12px; font-size: 12px;">Delete Profile &amp; Start Again</button>
    </form>
  </div>
  <script src="local-profile.js"></script>
  <script src="offline.js"></script>
  <script src="auth-ui.js"></script>
  <script>
    async function resetLocalProfile(event) {
      event.preventDefault();
      const email = document.getElementById("email").value.trim().toLowerCase();
      if (!window.confirm("This permanently deletes this profile and its saved progress from this device. Continue?")) return;
      try {
        if (!LocalProfile.clear(email)) {
          await showAuthAlert("No profile with that email was found on this device.");
          return;
        }
        await showAuthAlert("Local profile and progress deleted. Create a new profile to play again.", "success");
        window.location.href = "signup.html";
      } catch (error) {
        await showAuthAlert(error.message || "Could not clear the local profile.");
      }
    }
  </script>
</body>
</html>
