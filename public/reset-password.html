<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <base href="https://quiz-app-git-main-tab-bi.vercel.app/">
  <meta name="theme-color" content="#020617">
  <link rel="manifest" href="manifest.json">
  <title>Quiz Engine - Reset Password</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="theme-slate-light" style="align-items: center; justify-content: center;">
  <div class="unity-panel" style="position: relative; width: 100%; max-width: 360px; padding: 30px; text-align: center;">
    <a href="login.html" aria-label="Back to login" title="Back to login" style="position: absolute; top: 14px; left: 14px; color: var(--text-muted); font-size: 16px; text-decoration: none;"><i class="fa-solid fa-arrow-left"></i></a>
    <div style="width: 50px; height: 50px; background: var(--accent-gradient); border-radius: 14px; margin: 0 auto 15px; display: grid; place-items: center; color: #fff;"><i class="fa-solid fa-key"></i></div>
    <h2 style="font-size: 18px; font-weight: 800; margin-bottom: 5px;">Reset Password</h2>
    <p id="resetDescription" style="font-size: 11px; color: var(--text-muted); margin-bottom: 25px;">Enter your account email and we’ll send you a reset code.</p>
    <form id="requestForm" onsubmit="requestResetCode(event)" style="display: flex; flex-direction: column; gap: 14px; text-align: left;">
      <label style="font-size: 10px; font-weight: 700; color: var(--text-muted);">EMAIL<input type="email" id="email" required maxlength="254" placeholder="player@domain.com"></label>
      <button type="submit" id="requestBtn" class="unity-btn" style="padding: 12px; font-size: 12px;">Send Reset Code</button>
    </form>
    <form id="confirmForm" onsubmit="confirmPasswordReset(event)" style="display: none; flex-direction: column; gap: 14px; text-align: left;">
      <label style="font-size: 10px; font-weight: 700; color: var(--text-muted);">6-DIGIT EMAIL CODE<input type="text" id="code" required inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" placeholder="123456"></label>
      <label style="font-size: 10px; font-weight: 700; color: var(--text-muted);">NEW PASSWORD<input type="password" id="newPassword" required minlength="8" maxlength="128" autocomplete="new-password"></label>
      <label style="font-size: 10px; font-weight: 700; color: var(--text-muted);">CONFIRM PASSWORD<input type="password" id="confirmPassword" required minlength="8" maxlength="128" autocomplete="new-password"></label>
      <button type="submit" id="confirmBtn" class="unity-btn" style="padding: 12px; font-size: 12px;">Reset Password</button>
    </form>
  </div>
  <script src="auth-ui.js"></script>
  <script src="offline.js"></script>
  <script>
    let resetEmail = "";
    async function requestResetCode(event) {
      event.preventDefault();
      const button = document.getElementById("requestBtn");
      resetEmail = document.getElementById("email").value.trim().toLowerCase();
      button.disabled = true;
      button.innerText = "Sending Code...";
      try {
        if (!navigator.onLine) {
          await showAuthAlert("You are offline. Connect to the internet and try again.", "offline");
          return;
        }
        const response = await fetch("/api/password-reset/request", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: resetEmail })
        });
        const data = await response.json();
        if (!response.ok || !data.success) {
          await showAuthAlert(data.message || "Could not send a reset code.");
          return;
        }
        document.getElementById("requestForm").style.display = "none";
        document.getElementById("confirmForm").style.display = "flex";
        document.getElementById("resetDescription").innerText =
          "If the account exists, a code was sent. It expires in 10 minutes.";
        document.getElementById("code").focus();
      } catch (error) {
        await showAuthAlert(navigator.onLine ? "Could not connect to the server. Please try again." : "You are offline. Connect to the internet and try again.", navigator.onLine ? "error" : "offline");
      } finally {
        button.disabled = false;
        button.innerText = "Send Reset Code";
      }
    }

    async function confirmPasswordReset(event) {
      event.preventDefault();
      const password = document.getElementById("newPassword").value;
      if (password !== document.getElementById("confirmPassword").value) {
        await showAuthAlert("The passwords do not match.");
        return;
      }
      const button = document.getElementById("confirmBtn");
      button.disabled = true;
      button.innerText = "Resetting Password...";
      try {
        const response = await fetch("/api/password-reset/confirm", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            email: resetEmail,
            code: document.getElementById("code").value.trim(),
            password
          })
        });
        const data = await response.json();
        if (!response.ok || !data.success) {
          await showAuthAlert(data.message || "Could not reset the password.");
          return;
        }
        await showAuthAlert(data.message, "success");
        window.location.href = "login.html";
      } catch (error) {
        await showAuthAlert(navigator.onLine ? "Could not connect to the server. Please try again." : "You are offline. Connect to the internet and try again.", navigator.onLine ? "error" : "offline");
      } finally {
        button.disabled = false;
        button.innerText = "Reset Password";
      }
    }
  </script>
</body>
</html>
