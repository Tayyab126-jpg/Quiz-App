<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <base href="https://quiz-app-git-main-tab-bi.vercel.app/">
  <meta name="theme-color" content="#020617">
  <link rel="manifest" href="manifest.json">
  <title>Quiz Engine - Register</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="theme-slate-light" style="align-items: center; justify-content: center;">

  <div class="unity-panel" style="width: 100%; max-width: 360px; padding: 30px; text-align: center;">
    <div style="width: 50px; height: 50px; background: var(--accent-gradient); border-radius: 14px; margin: 0 auto 15px auto; display: flex; align-items: center; justify-content: center; font-size: 20px; color: #fff;">
      <i class="fa-solid fa-user-plus"></i>
    </div>
    <h2 style="font-size: 18px; font-weight: 800; margin-bottom: 5px;">Create Player Profile</h2>
    <p style="font-size: 11px; color: var(--text-muted); margin-bottom: 25px;">Your game profile and progress sync online</p>

    <form onsubmit="handleSignup(event)" style="display: flex; flex-direction: column; gap: 14px; text-align: left;">
      <div>
        <label style="font-size: 10px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 4px; display: block;">Full Name</label>
        <input type="text" id="name" required placeholder="Pro Gamer">
      </div>
      <div>
        <label style="font-size: 10px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 4px; display: block;">Email</label>
        <input type="email" id="email" required placeholder="player@domain.com">
      </div>
      <div>
        <label style="font-size: 10px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 4px; display: block;">Password</label>
        <input type="password" id="password" required placeholder="••••••••">
      </div>
      <button type="submit" id="submitBtn" class="unity-btn" style="padding: 12px; font-size: 12px; margin-top: 10px;">Register Account</button>
    </form>
    <p style="font-size: 11px; color: var(--text-muted); margin-top: 20px;">Already registered? <a href="login.html" style="color: var(--accent-color); font-weight: 700; text-decoration: none;">Login Here</a></p>
  </div>

  <script src="api-client.js"></script>
  <script src="offline.js"></script>
  <script src="auth-ui.js"></script>
  <script>
    async function handleSignup(e) {
      e.preventDefault();
      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim().toLowerCase();
      const password = document.getElementById("password").value;
      const btn = document.getElementById("submitBtn");
      btn.innerText = "Registering...";
      btn.disabled = true;

      try {
        if (!navigator.onLine) {
          await showAuthAlert("You are offline. Connect to the internet and try registering again.", "offline");
          return;
        }
        if (password.length < 8 || password.length > 128) {
          await showAuthAlert("Choose a password between 8 and 128 characters.");
          return;
        }
        sessionStorage.setItem("tempSignupData", JSON.stringify({ name, email, password }));
        window.location.href = "verify.html";
      } catch (err) {
        await showAuthAlert("Could not save signup details in this browser. Please enable session storage and try again.");
      } finally {
        btn.innerText = "Register Account";
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
