<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#020617">
  <link rel="manifest" href="manifest.json">
  <title>Quiz Engine - Security Verification</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body id="appBody" class="theme-slate-light" style="align-items: center; justify-content: center;">

  <div class="unity-panel" style="position: relative; width: 100%; max-width: 360px; padding: 30px; text-align: center;">
    <a href="signup.html" aria-label="Back to signup" title="Back to signup" style="position: absolute; top: 14px; left: 14px; color: var(--text-muted); font-size: 16px; text-decoration: none;">
      <i class="fa-solid fa-arrow-left"></i>
    </a>
    <div style="width: 50px; height: 50px; background: var(--accent-gradient); border-radius: 14px; margin: 0 auto 15px auto; display: flex; align-items: center; justify-content: center; font-size: 20px; color: #fff;">
      <i class="fa-solid fa-shield-halved"></i>
    </div>
    <h2 style="font-size: 18px; font-weight: 800; margin-bottom: 5px;">Human Verification</h2>
    <p style="font-size: 11px; color: var(--text-muted); margin-bottom: 25px;">Quick device check to create your local profile</p>

    <div style="display: flex; align-items: center; justify-content: space-between; background: rgba(0,0,0,0.3); border: 1px solid var(--border-color); padding: 12px 16px; border-radius: 10px; margin-bottom: 15px;">
      <span id="captchaText" style="font-family: monospace; font-size: 18px; font-weight: 800; letter-spacing: 4px; color: var(--accent-color);"></span>
      <button onclick="generateCaptcha()" type="button" style="background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 14px;">
        <i class="fa-solid fa-rotate-right"></i>
      </button>
    </div>

    <input type="text" id="captchaInput" placeholder="Enter CAPTCHA text" style="text-align: center; font-weight: 700; letter-spacing: 2px; margin-bottom: 20px;">

    <button id="verifyBtn" onclick="verifyAndRegister()" class="unity-btn" style="width: 100%; padding: 12px; font-size: 12px;">Verify & Register</button>
  </div>

  <script src="local-profile.js"></script>
  <script src="offline.js"></script>
  <script src="auth-ui.js"></script>
  <script>
    let currentCaptcha = "";

    function generateCaptcha() {
      const chars = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz";
      let captcha = "";
      for (let i = 0; i < 6; i++) captcha += chars.charAt(Math.floor(Math.random() * chars.length));
      currentCaptcha = captcha;
      document.getElementById("captchaText").innerText = captcha;
      document.getElementById("captchaInput").value = "";
    }
    window.onload = generateCaptcha;

    async function verifyAndRegister() {
      const userInput = document.getElementById("captchaInput").value.trim();
      if (!userInput) {
        await showAuthAlert("Please enter the CAPTCHA text.");
        return;
      }
      if (userInput !== currentCaptcha) {
        await showAuthAlert("Incorrect CAPTCHA. Try again.");
        generateCaptcha();
        return;
      }

      let signupData;
      try {
        signupData = JSON.parse(sessionStorage.getItem("tempSignupData") || "{}");
      } catch (err) {
        await showAuthAlert("Your signup session is invalid. Please restart signup.");
        sessionStorage.removeItem("tempSignupData");
        window.location.href = "signup.html";
        return;
      }
      if (!signupData.name || !signupData.email || !signupData.password) {
        await showAuthAlert("Session expired. Please restart signup.");
        sessionStorage.removeItem("tempSignupData");
        window.location.href = "signup.html";
        return;
      }

      const verifyButton = document.getElementById("verifyBtn");
      verifyButton.disabled = true;
      verifyButton.innerText = "Registering...";
      try {
        await LocalProfile.create(signupData);
        sessionStorage.removeItem("tempSignupData");
        await showAuthAlert("Profile created and saved on this device.", "success");
        window.location.href = "home.html";
      } catch (err) {
        await showAuthAlert(err.message || "Could not create your local profile.");
        generateCaptcha();
      } finally {
        verifyButton.disabled = false;
        verifyButton.innerText = "Verify & Register";
      }
    }
  </script>
</body>
</html>
